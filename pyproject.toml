[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "img2latex"
version = "0.2.0"
description = "Image to LaTeX conversion using a CNN/ResNet encoder and Transformer decoder"
readme = "README.md"
authors = [{ name = "Jeremy Cleland" }]
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
    "pandas>=1.3.0",
    "PyYAML>=6.0",
    "tqdm>=4.62.0",
    "python-Levenshtein>=0.12.2",
    "editdistance>=0.6.0",
    "typer>=0.7.0",
    "tensorboard>=2.10.0",
    "pillow>=9.0.0",
    "rich>=12.0.0",
    "opencv-python>=4.5.0",
    "nltk>=3.8",
    "psutil>=5.9.0",
]

[project.scripts]
img2latex = "img2latex.cli:app"

[tool.setuptools.packages.find]
include = ["img2latex*"]

[tool.ruff]
line-length = 88
target-version = "py311"
lint.select = ["E", "F", "W", "I"]
lint.ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
