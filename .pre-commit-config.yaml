repos:
  - repo: https://github.com/psf/black
    rev: 26.5.1 # Replace with the version you use
    hooks:
      - id: black
        language_version: python3
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        additional_dependencies: []
