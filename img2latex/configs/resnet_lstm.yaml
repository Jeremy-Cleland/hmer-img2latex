# Optional ResNet encoder + Transformer decoder variant
data:
  data_dir: "data"
  train_file: "im2latex_train_filter.lst"
  validate_file: "im2latex_validate_filter.lst"
  test_file: "im2latex_test_filter.lst"
  formulas_file: "im2latex_formulas.norm.lst"
  img_dir: "img"
  batch_size: 16
  num_workers: 8
  max_seq_length: 141
  min_freq: 5
  prefetch_factor: 2
  log_frequency: 1000
  eval_batch_size_multiplier: 1
  max_eval_batch_size: 16
  load_in_memory: false
  persistent_workers: true
  pin_memory: false
  cache_dir: "data/cache"
  bucket_batching: true
  augment: true

model:
  name: "resnet_transformer"
  encoder:
    cnn:
      img_height: 64
      img_width: 512
      channels: 1
      conv_filters: [32, 64, 128]
      kernel_size: 3
      pool_size: 2
      padding: "same"
    resnet:
      img_height: 64
      img_width: 512
      channels: 3
      model_name: "resnet18"
      freeze_backbone: false
  embedding_dim: 256
  decoder:
    hidden_dim: 256
    nhead: 8
    num_layers: 4
    dim_feedforward: 1024
    dropout: 0.1
    max_seq_length: 141

training:
  optimizer: "adamw"
  learning_rate: 0.0002
  weight_decay: 0.0001
  epochs: 30
  warmup_ratio: 0.05
  early_stopping_patience: 8
  clip_grad_norm: 1.0
  save_checkpoint_epochs: 5
  experiment_name: "img2latex_resnet"
  device: "mps"
  accumulation_steps: 2
  use_amp: false

evaluation:
  metrics: ["loss", "accuracy", "bleu", "exact_match", "edit_distance"]
  bleu_n: 4
  gen_samples: 256
  enhanced_samples: 2
  save_basic_metrics: true
  selection_metric: "bleu"

inference:
  beam_size: 5
  max_length: 141
  length_penalty: 0.7
  temperature: 1.0
  top_k: 0
  top_p: 0.0

logging:
  level: "INFO"
  log_to_file: true
  log_file: "train.log"
  use_colors: true

preprocessing:
  pad_value: 255
  normalization_mean: [0.485, 0.456, 0.406]
  normalization_std: [0.229, 0.224, 0.225]
