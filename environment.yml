name: hmer-im2latex
channels:
  - conda-forge
  - defaults
dependencies:
  # Python 3.11: official PyTorch macOS ARM wheels (with MPS) target 3.11/3.12
  - python=3.14.7
  - pip
  - numpy
  - pandas
  - pillow
  - opencv
  - scikit-image
  - python-levenshtein
  - editdistance
  - pyyaml
  - typer
  - rich
  - tqdm
  - matplotlib
  - seaborn
  - pytest
  - ruff
  - nltk
  - psutil
  - pip:
      # Official macOS ARM wheels include MPS. Do not install a CUDA wheel.
      - torch
      - torchvision
      - torchaudio
      - torchmetrics
      - tensorboard
      - timm
      - wandb

variables:
  PYTORCH_ENABLE_MPS_FALLBACK: "1"
  PYTORCH_MPS_HIGH_WATERMARK_RATIO: "0.0"
  PYTORCH_PREFER_CHANNELS_LAST: "1"
  KMP_DUPLICATE_LIB_OK: "TRUE"
  HDF5_USE_FILE_LOCKING: "FALSE"
  OMP_NUM_THREADS: "12"
  MKL_NUM_THREADS: "12"
